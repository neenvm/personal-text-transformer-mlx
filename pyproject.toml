[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "personal-text-transformer-mlx"
version = "0.1.0"
description = "Train and evaluate a small private text model locally on Apple silicon"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "neenvm" }]
keywords = ["mlx", "language-model", "privacy", "apple-silicon", "imessage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mlx==0.32.0",
  "numpy>=2.0,<3",
  "pytypedstream>=0.1,<1",
  "pyyaml>=6.0,<7",
  "tokenizers>=0.22,<0.24",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/neenvm/personal-text-transformer-mlx"
Issues = "https://github.com/neenvm/personal-text-transformer-mlx/issues"
Source = "https://github.com/neenvm/personal-text-transformer-mlx"

[project.scripts]
imessage-mlx = "imessage_mlx.cli:app"

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imessage_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
