name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify release boundary
        run: make check

      - name: Build release archives
        run: uv build --no-build-isolation

      - name: Audit release archives
        run: uv run python scripts/audit_archives.py dist/*.whl dist/*.tar.gz

      - name: Smoke test installed wheel
        run: |
          uv venv --python 3.11 /tmp/personal-text-transformer-wheel
          uv pip install --python /tmp/personal-text-transformer-wheel/bin/python dist/*.whl
          /tmp/personal-text-transformer-wheel/bin/python -m imessage_mlx --help
          /tmp/personal-text-transformer-wheel/bin/python - <<'PY'
          from imessage_mlx.config import default_config_path

          assert default_config_path("data.yaml").is_file()
          assert default_config_path("model-smoke.yaml").is_file()
          PY
